<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1E32" />
      <stop offset="100%" stop-color="#040E1A" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DEEFF" />
      <stop offset="60%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#1E50C8" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Navy Theme Squircle -->
  <rect x="3" y="3" width="122" height="122" rx="26" fill="url(#bgGrad)" stroke="#00E5FF" stroke-width="4.5" stroke-opacity="0.9" />

  <!-- Subtle Ambient Glow -->
  <circle cx="64" cy="64" r="44" fill="#00E5FF" fill-opacity="0.12" filter="blur(10px)" />

  <!-- Bold Themed "S" -->
  <text 
    x="64" 
    y="93" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="88" 
    font-weight="900" 
    text-anchor="middle" 
    fill="url(#sGrad)"
    filter="url(#cyanGlow)"
  >S</text>

  <!-- High-Tech Cyan Accent Dot -->
  <circle cx="104" cy="24" r="4" fill="#00E5FF" />
</svg>
